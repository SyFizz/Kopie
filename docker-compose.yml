# =========================================================================
# Kopie — Docker Compose (développement)
# Services : postgres, api, web-prof, web-eleve
# =========================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: kopie-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kopie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kopie}
      POSTGRES_DB: ${POSTGRES_DB:-kopie}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kopie} -d ${POSTGRES_DB:-kopie}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    container_name: kopie-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kopie}:${POSTGRES_PASSWORD:-kopie}@postgres:5432/${POSTGRES_DB:-kopie}
      # SECRET_KEY DOIT être défini dans .env (généré via `openssl rand -hex 32`).
      # Pas de valeur par défaut : `docker compose up` échoue volontairement si absent (NFR-4, FR-43).
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY must be defined in .env - generate with openssl rand -hex 32}"
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      # CORS piloté par .env ; défaut = dev local. À redéfinir pour staging/prod.
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:5173","http://localhost:5174"]}'
      DATA_RETENTION_MONTHS: ${DATA_RETENTION_MONTHS:-12}
      # Contrat OpenAPI monté en lecture seule depuis l'hôte (source de vérité unique).
      OPENAPI_CONTRACT_PATH: /contracts/openapi.yaml
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/app:/app/app
      - ./apps/api/alembic:/app/alembic
      - ./apps/api/tests:/app/tests
      - ./contracts:/contracts:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  web-prof:
    build:
      context: .
      dockerfile: ./apps/web-prof/Dockerfile.dev
    container_name: kopie-web-prof
    depends_on:
      - api
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web-prof/src:/app/apps/web-prof/src
      - ./apps/web-prof/index.html:/app/apps/web-prof/index.html

  web-eleve:
    build:
      context: .
      dockerfile: ./apps/web-eleve/Dockerfile.dev
    container_name: kopie-web-eleve
    depends_on:
      - api
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5174:5174"
    volumes:
      - ./apps/web-eleve/src:/app/apps/web-eleve/src
      - ./apps/web-eleve/index.html:/app/apps/web-eleve/index.html

volumes:
  pgdata:
    name: kopie_pgdata
